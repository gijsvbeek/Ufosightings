<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waarnemingslogboek — UFO-meldingen 1900–heden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128760;</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap');
:root{
  --night:#0B1026; --panel:#111832; --line:#2A3354;
  --ink:#E9E4D8; --ink-dim:#8B93B0;
  --signal:#FFB454; --signal-soft:rgba(255,180,84,.14);
  --comet:#7FD1E8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--night);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#map{position:absolute;inset:0;background:var(--night)}
.leaflet-container{background:var(--night)}

.hud{position:absolute;top:16px;left:16px;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;max-width:330px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.hud h1{font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
.hud .count{font-family:'Chakra Petch',sans-serif;font-size:24px;margin-top:8px;letter-spacing:.04em}
.hud .count small{font-size:10.5px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:2px}
.hud .stat{margin-top:8px;font-size:12px;line-height:1.5;color:var(--ink-dim);display:none}
.hud .stat b{color:var(--comet);font-weight:500}
.hud.kosmos .stat{display:block}

.timeline{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:1000;width:min(880px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
.tl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.year-display{font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:600;color:var(--signal);min-width:110px;letter-spacing:.04em}
.tl-controls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
button{font-family:'Chakra Petch',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 11px;border-radius:7px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:var(--signal);color:var(--signal)}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button.active{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.mode-group{display:flex}
.mode-group button{border-radius:0;border-right-width:0}
.mode-group button:first-child{border-radius:7px 0 0 7px}
.mode-group button:last-child{border-radius:0 7px 7px 0;border-right-width:1px}
button#mKosmos.active{background:rgba(127,209,232,.12);border-color:var(--comet);color:var(--comet)}

.tl-body{display:flex;gap:16px;align-items:stretch;margin-top:10px}
.orbit-wrap{display:none;flex:0 0 118px}
.timeline.kosmos .orbit-wrap{display:block}
#orbitCanvas{width:118px;height:118px}
.histo-col{flex:1;min-width:0}
.histo{position:relative;height:56px;cursor:pointer}
.timeline.kosmos .histo{height:76px}
.histo canvas{position:absolute;inset:0;width:100%;height:100%}
input[type=range]{position:absolute;left:0;right:0;bottom:-6px;width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:24px;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--signal);border:3px solid var(--night);box-shadow:0 0 0 1px var(--signal),0 0 14px rgba(255,180,84,.6)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--signal);border:3px solid var(--night);box-shadow:0 0 0 1px var(--signal),0 0 14px rgba(255,180,84,.6)}
input[type=range]:focus-visible{outline:2px solid var(--signal);outline-offset:4px}
.timeline.kosmos input[type=range]::-webkit-slider-thumb{background:var(--comet);box-shadow:0 0 0 1px var(--comet),0 0 14px rgba(127,209,232,.6)}
.timeline.kosmos input[type=range]::-moz-range-thumb{background:var(--comet);box-shadow:0 0 0 1px var(--comet),0 0 14px rgba(127,209,232,.6)}
.tl-labels{display:flex;justify-content:space-between;font-family:'Chakra Petch',sans-serif;font-size:10px;letter-spacing:.1em;color:var(--ink-dim);margin-top:10px}
.timeline.total .year-display{opacity:.25}
.timeline.total input[type=range]{opacity:0;pointer-events:none}

.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
.leaflet-popup-content{margin:14px 16px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:1.55;max-width:260px}
.pp-loc{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--signal);text-transform:uppercase}
.pp-meta{font-family:'Chakra Petch',sans-serif;font-size:10.5px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase;margin:4px 0 0}
.pp-desc{color:var(--ink);margin-top:8px}
.pp-cosmo{margin-top:8px;font-size:11.5px;color:var(--comet)}
.pp-expl{margin-top:8px;font-size:11.5px;color:var(--ink-dim)}
.pp-src{margin-top:10px;font-size:11px}
.pp-src a{color:var(--signal);text-decoration:none;border-bottom:1px solid rgba(255,180,84,.35)}
.pp-src a:hover{border-bottom-color:var(--signal)}
.pp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.leaflet-popup-close-button{color:var(--ink-dim) !important}

.viewbar{position:absolute;top:16px;right:16px;z-index:1001;display:flex;gap:8px}
.viewbar button{background:var(--panel);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.leaflet-top.leaflet-right .leaflet-control{margin-top:58px}

.listpanel{position:absolute;top:64px;right:16px;bottom:118px;left:366px;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
.listpanel[hidden]{display:none}
.lp-head{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.lp-head input,.lp-head select{background:var(--night);border:1px solid var(--line);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;padding:7px 10px;border-radius:7px;outline:none}
.lp-head input{flex:1;min-width:150px}
.lp-head input:focus,.lp-head select:focus{border-color:var(--signal)}
.lp-count{font-family:'Chakra Petch',sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;margin-left:auto}
.lp-rows{flex:1;overflow-y:auto;padding:2px 0 10px}
.lp-row{padding:10px 14px;border-bottom:1px solid rgba(42,51,84,.55)}
.lp-row:hover{background:rgba(255,180,84,.05)}
.lp-date{font-family:'Chakra Petch',sans-serif;font-size:10.5px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase}
.lp-loc{font-family:'Chakra Petch',sans-serif;font-size:12.5px;font-weight:600;color:var(--signal);letter-spacing:.04em;margin-top:2px}
.lp-shape{display:inline-block;font-size:9.5px;font-weight:400;color:var(--comet);border:1px solid rgba(127,209,232,.35);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:1px;text-transform:uppercase;letter-spacing:.08em}
.lp-sum{font-size:12.5px;color:var(--ink);margin-top:4px;line-height:1.5}
.lp-expl{font-size:11.5px;color:var(--ink-dim);margin-top:3px}
.lp-links{margin-top:5px;font-size:11px}
.lp-links a{color:var(--comet);cursor:pointer;text-decoration:none;border-bottom:1px solid rgba(127,209,232,.3)}
.lp-links a:hover{border-bottom-color:var(--comet)}
.lp-links .nolink{color:var(--ink-dim)}
.lp-more{margin:10px auto;display:block}
.lp-empty{padding:30px;text-align:center;color:var(--ink-dim);font-size:12.5px}
body.listmode .mode-group,body.listmode #playBtn{display:none}
@media (max-width:900px){.listpanel{left:16px;top:150px}}

.attrib{position:absolute;right:8px;bottom:2px;z-index:900;font-size:10px;color:var(--ink-dim)}
@media (max-width:640px){
  .hud{max-width:calc(100% - 32px);padding:10px 14px}
  .year-display{font-size:19px;min-width:92px}
  .orbit-wrap{flex-basis:96px}
  #orbitCanvas{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Wereldkaart met UFO-meldingen"></div>

<div class="hud" id="hud">
  <h1>Waarnemingslogboek</h1>
  <div class="count"><span id="count">laden…</span><small id="countLabel">meldingen</small></div>
  <div class="stat" id="cosmoStat"></div>
</div>

<div class="viewbar">
  <button id="viewList">&#9776; lijst</button>
  <button id="viewBase" class="active">&#128752; satelliet</button>
</div>

<div class="listpanel" id="listPanel" hidden>
  <div class="lp-head">
    <input id="lpSearch" type="search" placeholder="zoek in plaats of beschrijving&hellip;" aria-label="Zoeken">
    <select id="lpShape" aria-label="Filter op vorm"><option value="">alle vormen</option></select>
    <select id="lpLand" aria-label="Filter op land"><option value="">alle landen</option></select>
    <span class="lp-count" id="lpCount"></span>
  </div>
  <div class="lp-rows" id="lpRows"></div>
</div>

<div class="timeline" id="tl">
  <div class="tl-top">
    <div class="year-display" id="yearDisplay" aria-live="polite">—</div>
    <div class="tl-controls">
      <div class="mode-group" role="group" aria-label="Weergave">
        <button id="mYear" class="active">jaar</button><button id="mCum">t/m dit jaar</button><button id="mAll">totaal</button><button id="mKosmos">&#9737; kosmos</button>
      </div>
      <button id="playBtn">&#9658; afspelen</button>
    </div>
  </div>
  <div class="tl-body">
    <div class="orbit-wrap"><canvas id="orbitCanvas" aria-label="Baandiagram: positie van de aarde rond de zon"></canvas></div>
    <div class="histo-col">
      <div class="histo">
        <canvas id="histoCanvas"></canvas>
        <input type="range" id="yearSlider" min="1900" max="2026" value="1900" step="1" aria-label="Kies een moment">
      </div>
      <div class="tl-labels" id="tlLabels"><span></span></div>
    </div>
  </div>
</div>

<div class="attrib" id="attrib"></div>

<script type="module">
// Data leeft in /data/*.json (statisch geserveerd) en komt uit de pipeline (pipeline/).
// PUNT: [nuforcId, jaar, maand, dag, lat, lon, vormIdx, zonlengte*10, maanfase(0-7)]
const [PTS_META, SL_HIST, YH, SH, WORLD] = await Promise.all(
  ['data/points.json','data/slhist.json','data/yearhist.json','data/showers.json','data/world.json']
  .map(u => fetch(u).then(r => { if(!r.ok) throw new Error(u); return r.json(); }))
).catch(err => { document.getElementById('count').textContent = 'data laden mislukt'; throw err; });

const PTS = PTS_META.points;                 // gesorteerd op jaar/maand/dag
const MIN_Y = PTS_META.minYear, MAX_Y = PTS_META.maxYear;
const YEAR_HIST = YH.counts;                 // echte aantallen, incl. niet-geocodeerd
const SHOWERS = SH.showers, HUMAN = SH.human;
const N_TESTS = SHOWERS.length, SIG = 0.05 / N_TESTS; // Bonferroni
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MAAN_GLYPH = ['\u{1F311}','\u{1F312}','\u{1F313}','\u{1F314}','\u{1F315}','\u{1F316}','\u{1F317}','\u{1F318}'];
const MAAN_NAAM = ['nieuwe maan','wassende sikkel','eerste kwartier','wassende maan','volle maan','afnemende maan','laatste kwartier','afnemende sikkel'];
const WIN = 4; // venster ±4° rond gekozen zonlengte

function circ(a,b){return Math.min(Math.abs(a-b),360-Math.abs(a-b));}
function activeShower(sl){ return SHOWERS.find(s=>circ(sl,s.sl)<=WIN+2) || null; }
function activeHuman(sl){ return HUMAN.find(h=>circ(sl,h.sl)<=WIN) || null; }

// zonlengte -> geschatte datum (referentiejaar)
function jdN(y,mo,d){const a=(14-mo)/12|0,Y=y+4800-a,M=mo+12*a-3;return d+((153*M+2)/5|0)+365*Y+(Y/4|0)-(Y/100|0)+(Y/400|0)-32045;}
const SL2DATE = [];
(function(){
  const days=['',31,28,31,30,31,30,31,31,30,31,30,31];
  for(let mo=1;mo<=12;mo++)for(let d=1;d<=days[mo];d++){
    const n=jdN(2013,mo,d)-2451545.0, L=280.460+0.9856474*n, g=(357.528+0.9856003*n)*Math.PI/180;
    SL2DATE.push([((L+1.915*Math.sin(g)+0.020*Math.sin(2*g))%360+360)%360, d, mo]);
  }
})();
function slDate(sl){
  let best=SL2DATE[0], bd=999;
  for(const e of SL2DATE){const d=Math.min(Math.abs(e[0]-sl),360-Math.abs(e[0]-sl)); if(d<bd){bd=d;best=e;}}
  return `≈ ${best[1]} ${MAANDEN[best[2]-1].slice(0,3)}`;
}

// --- kaart ---
const map = L.map('map',{zoomControl:false,worldCopyJump:true,attributionControl:false,minZoom:2,maxZoom:17}).setView([28,5],2);
L.control.zoom({position:'topright'}).addTo(map);

// twee basiskaarten: echte satellietbeelden (Esri World Imagery) of de gestileerde nachtkaart
const worldLayer=L.geoJSON(WORLD,{pane:'tilePane',style:{color:'#3A4468',weight:.7,fillColor:'#161F3D',fillOpacity:1,opacity:1},interactive:false});
const satLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{minZoom:2,maxZoom:17});
const attribEl=document.getElementById('attrib'),baseBtn=document.getElementById('viewBase');
let baseSat=true;
function applyBase(){
  if(baseSat){map.removeLayer(worldLayer);satLayer.addTo(map);map.setMaxZoom(17);}
  else{map.removeLayer(satLayer);worldLayer.addTo(map);if(map.getZoom()>8)map.setZoom(8);map.setMaxZoom(8);}
  baseBtn.classList.toggle('active',baseSat);
  attribEl.textContent=baseSat
    ?'Beeld: Esri · Maxar · Earthstar Geographics · meldingen: NUFORC · astronomie: berekend'
    :'Landgrenzen: Natural Earth · meldingen: NUFORC · astronomie: berekend (zonlengte / maanfase)';
}
baseBtn.addEventListener('click',()=>{baseSat=!baseSat;applyBase();});
applyBase();

// jaarindex: PTS is gesorteerd op jaar -> [start,eind) per jaar
const yearStart=new Array(MAX_Y-MIN_Y+2).fill(PTS.length);
{let y=MIN_Y-1;for(let i=0;i<PTS.length;i++){while(y<PTS[i][1]){y++;yearStart[y-MIN_Y]=i;}}}
yearStart[MAX_Y-MIN_Y+1]=PTS.length;
const sliceYear=(a,b)=>PTS.slice(yearStart[a-MIN_Y],yearStart[b-MIN_Y+1]); // a t/m b

// webmercator per punt voorberekend (genormaliseerd 0..1)
const N=PTS.length, MX=new Float32Array(N), MY=new Float32Array(N);
for(let i=0;i<N;i++){
  const la=PTS[i][4]*Math.PI/180;
  MX[i]=(PTS[i][5]+180)/360;
  MY[i]=Math.min(1,Math.max(0,.5-Math.log(Math.tan(Math.PI/4+la/2))/(2*Math.PI)));
  PTS[i].push(i); // eigen index, zodat gefilterde subsets naar MX/MY kunnen wijzen
}

// jaarkleuren
const STOPS=[[26,42,140],[38,120,178],[64,190,182],[122,209,81],[233,196,50],[244,120,50],[214,45,60]];
function yearColor(y){
  const t=(y-MIN_Y)/(MAX_Y-MIN_Y),p=t*(STOPS.length-1),i=Math.min(Math.floor(p),STOPS.length-2),f=p-i;
  const c=STOPS[i].map((v,k)=>Math.round(v+(STOPS[i+1][k]-v)*f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// --- canvas-puntenlaag: tekent alle zichtbare meldingen in één keer ---
const spriteCache=new Map();
function sprite(color,r){
  const key=color+'|'+r;
  let s=spriteCache.get(key);
  if(s)return s;
  const dpr=window.devicePixelRatio||1, d=Math.ceil((r+1.5)*2*dpr);
  s=document.createElement('canvas');s.width=d;s.height=d;
  const ctx=s.getContext('2d');
  ctx.globalAlpha=.5;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(d/2,d/2,r*dpr,0,2*Math.PI);ctx.fill();
  ctx.globalAlpha=.95;ctx.lineWidth=dpr;ctx.strokeStyle=color;
  ctx.beginPath();ctx.arc(d/2,d/2,r*dpr,0,2*Math.PI);ctx.stroke();
  s._logical=d/dpr;
  spriteCache.set(key,s);
  return s;
}
const DotLayer=L.Layer.extend({
  onAdd(m){
    this._c=document.createElement('canvas');
    this._c.className='leaflet-zoom-hide';
    this._c.style.position='absolute';this._c.style.pointerEvents='none';
    m.getPanes().overlayPane.appendChild(this._c);
    m.on('moveend zoomend viewreset resize',this.redraw,this);
    this.redraw();
    return this;
  },
  onRemove(m){this._c.remove();m.off('moveend zoomend viewreset resize',this.redraw,this);},
  set(pts,colorFn,r){this._pts=pts;this._colorFn=colorFn;this._r=r;this.redraw();},
  redraw(){
    if(!this._map||!this._c)return;
    const m=this._map,size=m.getSize(),dpr=window.devicePixelRatio||1;
    const c=this._c;
    L.DomUtil.setPosition(c,m.containerPointToLayerPoint([0,0]));
    c.width=size.x*dpr;c.height=size.y*dpr;
    c.style.width=size.x+'px';c.style.height=size.y+'px';
    const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
    const pts=this._pts||[];if(!pts.length)return;
    const world=256*Math.pow(2,m.getZoom()), org=m.getPixelBounds().min;
    const r=this._r,pad=r+2;
    let curColor=null,spr=null,half=0;
    for(let k=0;k<pts.length;k++){
      const p=pts[k],i=p[9];
      const col=this._colorFn(p);
      if(col!==curColor){curColor=col;spr=sprite(col,r);half=spr._logical/2;}
      const y=MY[i]*world-org.y;
      if(y<-pad||y>size.y+pad)continue;
      // wereld herhaalt horizontaal: teken alle zichtbare kopieën
      const x=(((MX[i]*world-org.x)%world)+world)%world;
      for(let wx=x-world;wx<=size.x+pad;wx+=world){
        if(wx>=-pad)ctx.drawImage(spr,wx-half,y-half,spr._logical,spr._logical);
      }
    }
  },
  // dichtstbijzijnde punt binnen `tol` px van een containerpunt
  hit(cp,tol){
    const m=this._map,pts=this._pts||[];
    const world=256*Math.pow(2,m.getZoom()),org=m.getPixelBounds().min;
    let best=null,bd=tol*tol;
    for(let k=0;k<pts.length;k++){
      const i=pts[k][9];
      const y=MY[i]*world-org.y;
      const dy=y-cp.y;if(dy*dy>bd)continue;
      let x=(((MX[i]*world-org.x)%world)+world)%world;
      for(let wx=x-world;wx<=m.getSize().x;wx+=world){
        const dx=wx-cp.x,d=dx*dx+dy*dy;
        if(d<bd){bd=d;best=pts[k];}
      }
    }
    return best;
  }
});
const dots=new DotLayer().addTo(map);

// --- popup: details worden per maand on demand geladen ---
const detailCache=new Map();
function monthDetails(ym){
  if(!detailCache.has(ym))
    detailCache.set(ym,fetch(`data/details/${ym}.json`).then(r=>r.ok?r.json():{}));
  return detailCache.get(ym);
}
function esc(s){const t=document.createElement('span');t.textContent=s??'';return t.innerHTML;}
async function openPopup(p){
  const [id,jr,mnd,dag,lat,lon,,sl10,mb]=p;
  const ym=`${String(jr).padStart(4,'0')}${String(mnd).padStart(2,'0')}`;
  const d=(await monthDetails(ym))[id]||[];
  const [,tijd,plaats,regio,land,vorm,uitleg,tekst]=d;
  const slv=sl10/10, sh=SHOWERS.find(s=>circ(slv,s.sl)<=WIN);
  const waar=[plaats,regio].filter(Boolean).join(', ')+(land&&land!=='USA'?' · '+land:'');
  L.popup({maxWidth:290})
    .setLatLng([lat,lon])
    .setContent(
      `<div class="pp-loc">${esc(waar)||'onbekende locatie'}</div>`+
      `<div class="pp-meta"><span class="pp-dot" style="background:${yearColor(jr)}"></span>${dag} ${MAANDEN[mnd-1]} ${jr}${tijd?' · '+esc(tijd)+' uur':''}</div>`+
      (vorm?`<div class="pp-meta">vorm: ${esc(vorm)}</div>`:'')+
      `<div class="pp-cosmo">${MAAN_GLYPH[mb]} ${MAAN_NAAM[mb]} · aardbaan ${String(slv).replace('.',',')}°${sh?`<br>☄ in het ${sh.n}-venster (×${sh.ratio.toFixed(2)})`:''}</div>`+
      (tekst?`<div class="pp-desc">${esc(tekst)}</div>`:'')+
      (uitleg?`<div class="pp-expl">ⓘ mogelijke aardse verklaring: ${esc(uitleg)}</div>`:'')+
      `<div class="pp-src"><a href="https://nuforc.org/sighting/?id=${id}" target="_blank" rel="noopener">Volledig rapport op NUFORC ↗</a></div>`
    ).openOn(map);
}
map.on('click',e=>{
  const p=dots.hit(map.latLngToContainerPoint(e.latlng),9);
  if(p)openPopup(p);
});

// --- state ---
let year=MIN_Y, slSel=140, mode='year', playing=false, timer=null;
const countEl=document.getElementById('count'),countLabel=document.getElementById('countLabel');
const yearEl=document.getElementById('yearDisplay'),slider=document.getElementById('yearSlider');
const tl=document.getElementById('tl'),hud=document.getElementById('hud');
const cosmoStat=document.getElementById('cosmoStat'),tlLabels=document.getElementById('tlLabels');

function erf(x){ // Abramowitz & Stegun 7.1.26
  const s=x<0?-1:1;x=Math.abs(x);
  const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
function windowRatio(sl){
  let w=0,b=0;
  for(let d=0;d<360;d++){
    const c=circ(d+0.5,sl);
    if(c<=WIN)w+=SL_HIST[d]; else if(c>=WIN+1&&c<=15)b+=SL_HIST[d];
  }
  const wd=2*WIN+1,bd=2*(15-WIN);
  // binomiale toets: onder H0 valt fractie wd/(wd+bd) van (w+b) in het venster
  const tot=w+b,p0=wd/(wd+bd);
  const z=(w-tot*p0)/Math.sqrt(tot*p0*(1-p0));
  const p=2*(1-0.5*(1+erf(Math.abs(z)/Math.SQRT2)));
  return {w,ratio:(w/wd)/(b/bd),z,p};
}
function fmtP(p){return p<0.001?'< 0,001':('= '+p.toFixed(3).replace('.',','));}
const fmtN=n=>n.toLocaleString('nl-NL');

function yearTicks(){
  const q=(MAX_Y-MIN_Y)/4;
  return [MIN_Y,Math.round((MIN_Y+q)/10)*10,Math.round((MIN_Y+2*q)/10)*10,Math.round((MIN_Y+3*q)/10)*10,MAX_Y];
}

function render(){
  let pts,colorFn,r;
  if(mode==='all'){pts=PTS;colorFn=p=>yearColor(p[1]);r=2;}
  else if(mode==='cum'){pts=sliceYear(MIN_Y,year);colorFn=()=>'#FFB454';r=2.2;}
  else if(mode==='kosmos'){pts=PTS.filter(p=>circ(p[7]/10,slSel)<=WIN);colorFn=()=>'#7FD1E8';r=2.6;}
  else{pts=sliceYear(year,year);colorFn=()=>'#FFB454';r=3.2;}
  dots.set(pts,colorFn,r);
  map.closePopup();

  let realN;
  if(mode==='all') realN=YEAR_HIST.reduce((a,b)=>a+b,0);
  else if(mode==='cum') realN=YEAR_HIST.slice(0,year-MIN_Y+1).reduce((a,b)=>a+b,0);
  else if(mode==='year') realN=YEAR_HIST[year-MIN_Y];
  else realN=null;
  countEl.textContent = realN!==null ? fmtN(realN) : fmtN(pts.length);
  tl.classList.toggle('total',mode==='all');
  tl.classList.toggle('kosmos',mode==='kosmos');
  hud.classList.toggle('kosmos',mode==='kosmos');

  if(mode==='kosmos'){
    yearEl.textContent=`${slSel}° ${slDate(slSel)}`;
    countLabel.textContent=`op dit stuk aardbaan (alle jaren) · ${fmtN(pts.length)} op de kaart`;
    const {w,ratio,p}=windowRatio(slSel);
    countEl.textContent=fmtN(w);
    const sh=activeShower(slSel);
    const hu=activeHuman(slSel);
    let oordeel;
    if(p<SIG && ratio>1) oordeel=hu?'significante piek (⚠ menselijke oorzaak)':'<b>significante piek</b>';
    else if(p<SIG && ratio<1) oordeel='significant tekort (vermoedelijk seizoenseffect)';
    else oordeel='geen significant effect';
    cosmoStat.innerHTML=
      `Volledige dataset: <b>${fmtN(w)}</b> meldingen in dit venster (±${WIN}°)<br>`+
      `<b>×${ratio.toFixed(2)}</b> t.o.v. omliggende dagen · p ${fmtP(p)} → ${oordeel}`+
      (sh?`<br>☄ <b>${sh.n}</b> (piek ${sh.dat}) · ×${sh.ratio.toFixed(2)} · p ${sh.p}${sh.note?'<br>'+sh.note:''}`:'')+
      (hu?`<br>⚠ <b>${hu.n}</b> — ${hu.x}; deze piek is menselijk, niet kosmisch`:'')+
      `<br><span style="opacity:.75">Maanfase-effect over de hele dataset: meeste meldingen rond ${MAAN_NAAM[SH.moon.peakPhase]} (χ² = ${String(SH.moon.chi2).replace('.',',')}; ${SH.moon.sig?'p < 0,001':'niet significant'}). Drempel per toets: p < ${SIG.toFixed(4).replace('.',',')} (${N_TESTS} toetsen, Bonferroni).</span>`;
    tlLabels.innerHTML='<span>mrt</span><span>jun</span><span>sep</span><span>dec</span><span>mrt</span>';
    slider.min=0;slider.max=359;slider.value=slSel;
  }else{
    yearEl.textContent=mode==='all'?'—':year;
    const shown=` · ${fmtN(pts.length)} op de kaart`;
    countLabel.textContent=(mode==='all'?`meldingen, ${MIN_Y}–${MAX_Y}`:mode==='cum'?`meldingen t/m ${year}`:`meldingen in ${year}`)+shown;
    tlLabels.innerHTML=yearTicks().map(t=>`<span>${t}</span>`).join('');
    slider.min=MIN_Y;slider.max=MAX_Y;slider.value=year;
  }
  drawHisto();drawOrbit();
}

// --- histogram / zonlengte-spectrum ---
const hc=document.getElementById('histoCanvas');
function drawHisto(){
  const dpr=window.devicePixelRatio||1,w=hc.clientWidth,h=hc.clientHeight;
  hc.width=w*dpr;hc.height=h*dpr;
  const ctx=hc.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  if(mode==='kosmos'){
    const max=Math.max(...SL_HIST),bw=w/360;
    // zwermvensters als lichte banden
    for(const s of SHOWERS){
      ctx.fillStyle='rgba(127,209,232,.10)';
      const x0=(s.sl-WIN)/360*w;
      ctx.fillRect(x0,0,(2*WIN)/360*w,h-12);
    }
    for(let d=0;d<360;d++){
      const v=SL_HIST[d]/max,bh=Math.max(1,v*(h-18));
      const sel=circ(d+0.5,slSel)<=WIN;
      ctx.fillStyle=sel?'#7FD1E8':'#2A3354';
      ctx.fillRect(d*bw,h-12-bh,Math.max(.8,bw-.2),bh);
    }
    // menselijke pieken als amberkleurige banden
    for(const hm of HUMAN){
      ctx.fillStyle='rgba(255,180,84,.12)';
      ctx.fillRect((hm.sl-WIN)/360*w,0,(2*WIN)/360*w,h-12);
    }
    // markeer significante zwermen onderaan
    ctx.fillStyle='#8B93B0';ctx.font='8.5px Chakra Petch,sans-serif';ctx.textAlign='center';
    for(const s of SHOWERS){if(s.sig&&s.ratio>1)ctx.fillText('☄',s.sl/360*w,h-2);}
  }else{
    const n=MAX_Y-MIN_Y+1,bw=w/n;
    const max=Math.max(...YEAR_HIST);
    for(let i=0;i<n;i++){
      const y=MIN_Y+i,v=YEAR_HIST[i]/max,bh=Math.max(1.5,v*(h-6));
      let fill;
      if(mode==='all')fill=yearColor(y);
      else{const sel=mode==='cum'?(y<=year):(y===year);fill=sel?'#FFB454':'#2A3354';}
      ctx.fillStyle=fill;ctx.fillRect(i*bw+.5,h-bh,Math.max(1,bw-1.2),bh);
    }
  }
}

// --- baandiagram (signatuur van de kosmos-modus) ---
const oc=document.getElementById('orbitCanvas');
function drawOrbit(){
  if(mode!=='kosmos')return;
  const dpr=window.devicePixelRatio||1,w=oc.clientWidth,h=oc.clientHeight;
  oc.width=w*dpr;oc.height=h*dpr;
  const ctx=oc.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-10;
  // heliocentrische hoek = zonlengte + 180°
  const ang=s=>(s+180)*Math.PI/180;
  // baan
  ctx.strokeStyle='#2A3354';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);ctx.stroke();
  // zwermbogen op de baan
  for(const s of SHOWERS){
    const strong=s.sig && s.ratio>1;
    ctx.strokeStyle=strong?'rgba(127,209,232,.9)':'rgba(127,209,232,.35)';
    ctx.lineWidth=strong?3.5:2;
    ctx.beginPath();ctx.arc(cx,cy,R,ang(s.sl-WIN),ang(s.sl+WIN));ctx.stroke();
  }
  // menselijke events als amberstreepjes op de baan
  for(const hm of HUMAN){
    ctx.strokeStyle='rgba(255,180,84,.55)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,R,ang(hm.sl-WIN),ang(hm.sl+WIN));ctx.stroke();
  }
  // zon
  ctx.fillStyle='#FFB454';
  ctx.beginPath();ctx.arc(cx,cy,5,0,2*Math.PI);ctx.fill();
  ctx.strokeStyle='rgba(255,180,84,.35)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(cx,cy,7.5,0,2*Math.PI);ctx.stroke();
  // aarde op gekozen positie
  const ex=cx+R*Math.cos(ang(slSel)),ey=cy+R*Math.sin(ang(slSel));
  ctx.fillStyle='#7FD1E8';
  ctx.beginPath();ctx.arc(ex,ey,4.5,0,2*Math.PI);ctx.fill();
  ctx.strokeStyle='rgba(127,209,232,.4)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(ex,ey,7,0,2*Math.PI);ctx.stroke();
}

// --- interactie ---
slider.addEventListener('input',e=>{
  if(mode==='kosmos')slSel=+e.target.value; else year=+e.target.value;
  render();
  if(listOpen)buildList();
});

// --- lijstweergave: index van alle meldingen per jaar, met zoeken en filters ---
const listPanel=document.getElementById('listPanel'),lpRows=document.getElementById('lpRows');
const lpSearch=document.getElementById('lpSearch'),lpShape=document.getElementById('lpShape');
const lpLand=document.getElementById('lpLand'),lpCount=document.getElementById('lpCount');
const viewListBtn=document.getElementById('viewList');
let listOpen=false,listAll=[],listRows=[],listShown=0,listGeo=new Map(),listToken=0;
const CHUNK=250;

for(const s of [...PTS_META.shapes].sort((a,b)=>a.localeCompare(b,'nl')))
  lpShape.insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`);

viewListBtn.addEventListener('click',()=>{listOpen=!listOpen;applyList();});
function applyList(){
  document.body.classList.toggle('listmode',listOpen);
  listPanel.hidden=!listOpen;
  viewListBtn.classList.toggle('active',listOpen);
  if(listOpen){
    map.closePopup();
    if(mode!=='year')setMode('year');
    buildList();
  }
}
async function buildList(){
  const tok=++listToken,y=year;
  lpRows.innerHTML='<div class="lp-empty">laden…</div>';
  const yy=String(y).padStart(4,'0');
  const months=await Promise.all(Array.from({length:12},(_,i)=>monthDetails(`${yy}${String(i+1).padStart(2,'0')}`)));
  if(tok!==listToken)return;
  listGeo=new Map();
  for(const p of sliceYear(y,y))listGeo.set(p[0],p);
  const rows=[];
  months.forEach((m,i)=>{
    for(const id in m){
      const d=m[id];
      rows.push({id:+id,mo:i+1,d:d[0],tijd:d[1],plaats:d[2],regio:d[3],land:d[4],vorm:d[5],uitleg:d[6],tekst:d[7],
                 q:`${d[2]} ${d[3]} ${d[4]} ${d[7]}`.toLowerCase()});
    }
  });
  rows.sort((a,b)=>a.mo-b.mo||a.d-b.d||a.id-b.id);
  listAll=rows;
  // landfilter opnieuw vullen (meest voorkomende eerst), selectie behouden waar mogelijk
  const sel=lpLand.value,freq={};
  rows.forEach(r=>{if(r.land)freq[r.land]=(freq[r.land]||0)+1;});
  lpLand.innerHTML='<option value="">alle landen</option>'+
    Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(([l])=>`<option>${esc(l)}</option>`).join('');
  lpLand.value=[...lpLand.options].some(o=>o.value===sel)?sel:'';
  filterList();
}
function filterList(){
  const q=lpSearch.value.trim().toLowerCase(),vorm=lpShape.value,land=lpLand.value;
  listRows=listAll.filter(r=>(!q||r.q.includes(q))&&(!vorm||r.vorm===vorm)&&(!land||r.land===land));
  listShown=0;lpRows.innerHTML='';
  lpCount.textContent=`${fmtN(listRows.length)}${listRows.length!==listAll.length?' van '+fmtN(listAll.length):''} · ${year}`;
  if(!listRows.length){lpRows.innerHTML=`<div class="lp-empty">geen meldingen gevonden in ${year}</div>`;return;}
  showMoreRows();
}
function showMoreRows(){
  const end=Math.min(listShown+CHUNK,listRows.length);
  let html='';
  for(let i=listShown;i<end;i++){
    const r=listRows[i],p=listGeo.get(r.id);
    const waar=[r.plaats,r.regio].filter(Boolean).join(', ');
    html+=`<div class="lp-row">`+
      `<div class="lp-date">${r.d} ${MAANDEN[r.mo-1].slice(0,3)} ${year}${r.tijd?' · '+esc(r.tijd):''}</div>`+
      `<div class="lp-loc">${esc(waar)||'onbekende locatie'}${r.land&&r.land!=='USA'?' · '+esc(r.land):''}${r.vorm?`<span class="lp-shape">${esc(r.vorm)}</span>`:''}</div>`+
      (r.tekst?`<div class="lp-sum">${esc(r.tekst)}</div>`:'')+
      (r.uitleg?`<div class="lp-expl">ⓘ mogelijke aardse verklaring: ${esc(r.uitleg)}</div>`:'')+
      `<div class="lp-links">${p?`<a class="lp-map" data-id="${r.id}">toon op kaart</a> · `:'<span class="nolink">niet op de kaart (geen coördinaten) · </span>'}`+
      `<a href="https://nuforc.org/sighting/?id=${r.id}" target="_blank" rel="noopener">rapport ↗</a></div>`+
      `</div>`;
  }
  listShown=end;
  if(listShown<listRows.length)html+=`<button class="lp-more" id="lpMore">meer tonen (${fmtN(listRows.length-listShown)} over)</button>`;
  const old=document.getElementById('lpMore');if(old)old.remove();
  lpRows.insertAdjacentHTML('beforeend',html);
}
lpRows.addEventListener('click',e=>{
  const more=e.target.closest('#lpMore');
  if(more){showMoreRows();return;}
  const a=e.target.closest('.lp-map');
  if(!a)return;
  const p=listGeo.get(+a.dataset.id);
  if(!p)return;
  listOpen=false;applyList();render();
  map.setView([p[4],p[5]],baseSat?10:7);
  openPopup(p);
});
lpSearch.addEventListener('input',filterList);
lpShape.addEventListener('change',filterList);
lpLand.addEventListener('change',filterList);
const modeBtns={year:document.getElementById('mYear'),cum:document.getElementById('mCum'),all:document.getElementById('mAll'),kosmos:document.getElementById('mKosmos')};
function setMode(m){
  mode=m;
  Object.entries(modeBtns).forEach(([k,b])=>b.classList.toggle('active',k===m));
  if(m==='all'&&playing)stopPlay();
  render();
}
Object.keys(modeBtns).forEach(k=>modeBtns[k].addEventListener('click',()=>setMode(k)));

const playBtn=document.getElementById('playBtn');
function stopPlay(){playing=false;clearInterval(timer);playBtn.innerHTML='► afspelen';playBtn.classList.remove('active');}
playBtn.addEventListener('click',()=>{
  if(playing){stopPlay();return;}
  if(mode==='all')setMode('year');
  playing=true;playBtn.innerHTML='❚❚ pauze';playBtn.classList.add('active');
  timer=setInterval(()=>{
    if(mode==='kosmos'){slSel=(slSel+2)%360;}
    else{year++;if(year>=MAX_Y){year=MAX_Y;stopPlay();}}
    render();
  },mode==='kosmos'?140:300);
});
window.addEventListener('resize',()=>{drawHisto();drawOrbit();});
year=1947; // beginjaar met wat te zien (Roswell-tijdperk)
render();
</script>
